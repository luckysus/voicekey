[package]
name = "voicekey"
version.workspace = true
edition.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
voicekey-core = { path = "../../crates/core" }
voicekey-platform = { path = "../../crates/platform" }
voicekey-hanbao = { path = "../../crates/hanbao" }
voicekey-wtlocal = { path = "../../crates/wtlocal" }
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rodio = { version = "0.20", default-features = false, features = ["wav"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
anyhow = "1"
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = "0.3"
sha2 = "0.10"
md-5 = "0.10"
hex = "0.4"
base64 = "0.22"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
# 会话提示音（NSSound，与 cometix-dictation 同源；仅启用所需特性控制编译面）
objc2-app-kit = { version = "0.3", features = ["NSSound"] }
objc2-foundation = { version = "0.3", features = ["NSString"] }
